# llm-chat — bare-bones LLM chat without the brain orchestrator.
#
# Useful when you want to talk to a model directly: no tools, no
# delegation, no agentic loop — just chat.input → LLM → chat.response.
# A good baseline to compare against the richer brain-driven flow.

nodes:
  - type: chat
    name: human
    description: "Chat UI — talks straight to a single LLM."
    priority: 5
    position: { x: 100, y: 300 }
    subscriptions:
      - topic: "chat.response"

  - type: llm-basic
    name: assistant
    description: "Single-shot LLM. Reads chat.input, replies on chat.response."
    priority: 5
    position: { x: 500, y: 300 }
    subscriptions:
      - topic: "chat.input"
    config_overrides:
      model: "ollama/gemma4:e4b"
      system_prompt: "You are a concise, helpful assistant. Answer in 1-3 sentences."
      response_topic: "chat.response"
